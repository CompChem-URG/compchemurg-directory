bio: "Holding a PharmD and an MSc in Pharmacology (Distinction), I bridge molecular pharmacology with computational modeling. My research focuses on developing Python and machine learning workflows for structure-based docking, scaffold-aware QSAR modeling, and virtual screening of small molecules. With proven experience processing large bioactivity datasets and building open-source computational tools, I develop interpretable models grounded in physical and biological mechanisms."

