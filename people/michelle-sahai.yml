bio: "Dr Michelle Sahai is a Lecturer in Biosciences (Drug Discovery) at Brunel University London. Her research combines AI-driven drug discovery, computational structural biology and molecular simulations to understand protein–ligand interactions and develop new therapeutic approaches, with a particular interest in membrane transporters and the molecular mechanisms of drug action."

