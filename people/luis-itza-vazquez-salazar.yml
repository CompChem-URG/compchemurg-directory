bio: "I am originally from Mexico City. I studied chemistry at the National Autonomous University of Mexico. Later, I completed a master’s degree at the University of Groningen, supported by an ERASMUS+ scholarship from the European Union. After earning my MSc. degree, I pursued a PhD in physical chemistry at the University of Basel. At the end of my PhD, I received an SNSF fellowship for a postdoctoral stay at the Institute for Theoretical Physics at Heidelberg University."

